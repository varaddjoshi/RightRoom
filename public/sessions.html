<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schedule · RightRoom</title>
<link rel="stylesheet" href="/rr.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1b2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RightRoom">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  a.talk { color: inherit; text-decoration: none; min-height: 64px; }
  .talk .fc { color: var(--rr-full); font-weight: 700; }
  @media (min-width: 960px) { #view .fl .rr-btn-stack { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<main class="rr-screen rr-screen--wide" id="main">
  <div class="rr-sign"><span class="rr-eyebrow" id="now">Now</span><h1>Schedule</h1></div>
  <div class="seg" role="group" aria-label="View" style="justify-self:start"><button type="button" data-mode="map" aria-pressed="true">Map</button><button type="button" data-mode="list" aria-pressed="false">List</button></div>
  <div id="view" aria-live="polite"><div class="rr-skel" aria-hidden="true"><i></i><i></i><i></i></div></div>
  <a class="rr-dialog-all" href="/news">All announcements</a>
  <p class="note" id="legend"></p>
  <p class="rr-panel rr-span m0" id="err" role="alert" hidden></p>
</main>
<script src="/app.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  $('legend').innerHTML = `${RR.label('live')} room status · ${RR.label('crowd-sourced')} Wi-Fi · ${RR.label('stand-in')} forecast`;
  $('now').textContent = `Now · ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
  // ?view=list opens the list (for links and checks); Map is the default.
  const q = new URLSearchParams(location.search);
  let mode = q.get('view') === 'list' ? 'list' : 'map', here = null, forecast = null, topics = {}, notices = [], role = 'attendee';
  // Staff and organisers use this board to pick a door: tapping a room opens its door console.
  const pickDoor = q.get('pick') === 'door';
  const open = (id) => { location.href = role === 'attendee' || role === 'guest' ? `/r/${encodeURIComponent(id)}` : `/staff/room/${encodeURIComponent(id)}`; };

  const riskWord = { high: 'Likely to fill', medium: 'May fill', low: 'Unlikely to fill' };
  function fcLine(id) {
    if (forecast === false) return '<span>Forecast: not available yet</span>';
    const f = forecast?.find((x) => x.room === id);
    if (!f) return '';
    const by = f.likelyFullMinute != null && f.risk !== 'low' ? `, around ${Math.round(f.likelyFullMinute)} min in` : '';
    return `<span class="fc">${riskWord[f.risk] || f.risk}${by} · ${Math.round(f.expectedFill * 100)}% expected</span>`;
  }

  async function render() {
    try {
      if (mode === 'map') {
        const floors = await RR.api(`/floors${here ? `?from=${encodeURIComponent(here)}` : ''}`);
        RR.floorBoard($('view'), floors, { role: role === 'guest' ? 'attendee' : role, here, mode: 'map', notices, onPick: open });
        return;
      }
      const rooms = await RR.api('/sessions');
      rooms.sort((a, b) => b.floor - a.floor || a.id.localeCompare(b.id));
      // List mode: one group per floor (top floor first), each led by that floor's announcements.
      const floorsOf = [...new Set(rooms.map((r) => r.floor))];
      const all = RR.forFloor(notices, null);
      $('view').innerHTML = `<div class="fl-board">${all.length ? `<div class="fl-all">${all.map(RR.notice).join('')}</div>` : ''}${floorsOf.map((fl) => `<section class="fl" aria-label="Floor ${Number(fl)}">
        <div class="fl-h"><b>FLOOR ${Number(fl)}</b></div>${RR.forFloor(notices, fl).map(RR.notice).join('')}
        <div class="rr-btn-stack">${rooms.filter((r) => r.floor === fl).map((r) => `
        <a class="talk" href="${role === 'attendee' || role === 'guest' ? '/r/' : '/staff/room/'}${encodeURIComponent(r.id)}">
          <div><b>${RR.esc(r.title)}</b>
            <span>${RR.esc(RR.roomName(r))} · Floor ${RR.esc(r.floor)}${r.id === here ? ' · you are here' : ''} · ${r.stepFree ? '&#9855; ' : ''}${RR.esc(r.access)}</span>
            <span>${Number(r.taken)} of ${Number(r.capacity)} in${r.wifi != null ? ` · Wi-Fi ${Number(r.wifi)} Mbps` : ''}${topics[r.id]?.length ? ` · topics: ${topics[r.id].map(RR.esc).join(', ')}` : ''}</span>
            ${fcLine(r.id)}
          </div>${RR.status(r.status)}</a>`).join('')}</div></section>`).join('')}</div>`;
      RR.motion($('view'), 'list');
    } catch (x) { RR.showError($('err'), x); }
  }

  document.querySelectorAll('.seg button').forEach((x) => x.setAttribute('aria-pressed', x.dataset.mode === mode));
  document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => {
    mode = b.dataset.mode;
    document.querySelectorAll('.seg button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    render();
  }));

  (async () => {
    const me = await RR.whoami();
    role = me?.role || 'attendee';
    // Say which event this live board belongs to (decision: live pages are the live event's, never mixed).
    const ev = await RR.liveEvent();
    if (ev.name && !pickDoor) $('now').textContent = `${ev.name} · ${$('now').textContent}`;
    if (pickDoor) { document.querySelector('.rr-sign h1').textContent = 'Pick your door'; $('now').textContent = 'Tap the room you are covering'; }
    const rooms = await RR.api('/sessions').catch(() => []);
    // Where the person is checked in, for "you are here" and walking times; topics come from each room's comments.
    // Only the room you last used is checked (not every room), so a 28-room venue stays one request for this.
    const last = RR.recall('rr-room');
    if (me && last && rooms.some((r) => r.id === last)) { const s = await RR.api(`/spaces/${encodeURIComponent(last)}`).catch(() => null); if (s?.me?.checkedIn) here = last; }
    await Promise.all(rooms.map(async (r) => {
      topics[r.id] = ((await RR.api(`/spaces/${encodeURIComponent(r.id)}/comments`).catch(() => ({ topics: [] }))).topics || []).slice(0, 3);
    }));
    forecast = await RR.api('/forecast').then((f) => f.sessions).catch(() => false);
    notices = await RR.api('/announcements').catch(() => []);
    await render();
    let t;
    RR.live('*', { status: () => { clearTimeout(t); t = setTimeout(render, 300); } });
    const myFloor = rooms.find((r) => r.id === here)?.floor ?? null;
    RR.watchNotices({ floor: myFloor, onChange: (a) => { notices = [a, ...notices]; render(); } });
    // Demo and screenshot aid: ?notices=open opens the first floor's notices.
    if (new URLSearchParams(location.search).get('notices') === 'open') (document.querySelector('.notice-badge[data-urgent]') || document.querySelector('.notice-badge'))?.click();
  })();
</script>
</body>
</html>
