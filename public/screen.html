<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Room status · RightRoom</title>
<link rel="stylesheet" href="/rr.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1b2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RightRoom">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  /* Big screen outside a room: read from across the room, no controls. Sizes scale with the screen. */
  html, body { height: 100%; }
  .wall { min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 3vh; padding: 4vh max(16px, 4vw); }
  .wall .rr-sign h1 { font-size: clamp(2rem, 5vw, 6rem); }
  .wall .rr-eyebrow { font-size: clamp(0.8125rem, 1.4vw, 1.75rem); }
  .now { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 4vw; align-items: center; }
  @media (max-width: 720px) { .now { grid-template-columns: 1fr; } }
  .big-count { font: 800 clamp(4rem, 14vw, 16rem)/0.9 var(--rr-font-sign); font-variant-numeric: tabular-nums; }
  .big-count small { font-size: 0.35em; color: var(--rr-muted); }
  .wall .rr-status { font-size: clamp(1rem, 2.4vw, 3rem); padding: 0.2em 0.6em; }
  .wall .rr-route { padding: clamp(16px, 2vw, 40px); }
  .wall .rr-route__to { font-size: clamp(1.375rem, 3vw, 4rem); }
  .wall .rr-route__meta, .wall .rr-access { font-size: clamp(0.9375rem, 1.6vw, 2rem); }
  .wall .rr-route__time { font-size: clamp(1.875rem, 4vw, 5rem); }
  .wall .rr-label { font-size: clamp(0.8125rem, 1.1vw, 1.25rem); }
  .wall .rr-route__time small { font-size: clamp(0.8125rem, 1vw, 1.25rem); }
  .wall .rr-route__arrow { width: clamp(40px, 4vw, 96px); height: clamp(40px, 4vw, 96px); }
  .wall .rr-route__arrow::before { width: 45%; height: 45%; }
  .wall .rr-status::before { width: 0.6em; height: 0.6em; }
  .foot { color: var(--rr-muted); font-size: clamp(0.8125rem, 1.2vw, 1.5rem); }
</style>
</head>
<body class="rr-dark rr-nonav">
<main class="wall" aria-live="polite">
  <header class="rr-sign"><span class="rr-eyebrow" id="eyebrow">Room</span><h1 id="title">Room status</h1></header>
  <div class="now">
    <div><div class="big-count" id="count"></div><div class="line" id="st"></div></div>
    <div id="next"></div>
  </div>
  <p class="foot">Scan the "I'm at the door" code to join the queue. Scan "I'm in the room" when you sit down so the count stays right.</p>
</main>
<script src="/app.js"></script>
<script>
(async () => {
  const room = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop());
  const $ = (id) => document.getElementById(id);
  async function refresh() {
    try {
      const [v, floors] = await Promise.all([RR.api(`/spaces/${encodeURIComponent(room)}`), RR.api(`/floors?from=${encodeURIComponent(room)}`)]);
      document.title = `${RR.roomName(v)} · RightRoom`;
      $('eyebrow').textContent = `${RR.roomName(v)} · Floor ${v.floor} · now`;
      $('title').textContent = v.title;
      $('count').innerHTML = `${v.taken}<small>/ ${v.capacity}</small>`;
      $('count').setAttribute('aria-label', `${v.taken} of ${v.capacity} seats taken`);
      $('st').innerHTML = RR.status(v.status) + ' ' + RR.label('live') + (v.standIn ? ` <span class="rr-label">includes ${Number(v.standIn)} stand-in</span>` : '');
      // When full, point people at the nearest room with free seats (walking minutes from this room).
      const alt = floors.flatMap((f) => f.rooms).filter((r) => r.id !== v.id && r.free > 0).sort((a, b) => a.walk - b.walk || b.free - a.free)[0];
      $('next').innerHTML = v.status === 'full' && alt
        ? `<div class="rr-route"><span class="rr-route__arrow" aria-hidden="true"></span><div><div class="rr-route__to">${RR.esc(RR.roomName(alt.id))} has seats</div><div class="rr-route__meta">${RR.esc(alt.title)} · ${alt.free} free</div><span class="rr-access">${alt.stepFree ? '&#9855; ' : ''}${RR.esc(alt.access)}</span></div><div class="rr-route__time">${Number(alt.walk)}<small>MIN</small></div></div>`
        : v.status === 'full' ? '<p class="note">Every room is full right now. Join the queue at the door.</p>' : `<p class="rr-route__to">${v.free} seats free</p>`;
    } catch (e) { $('next').innerHTML = `<p class="note">${RR.esc(e.message)}</p>`; }
  }
  await refresh();
  RR.live('*', { status: refresh });
})();
</script>
</body>
</html>
