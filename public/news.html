<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Announcements · RightRoom</title>
<link rel="stylesheet" href="/rr.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1b2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RightRoom">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  @media (min-width: 960px) { #list { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; } }
</style>
</head>
<body>
<main class="rr-screen rr-screen--wide" id="main">
  <div class="rr-sign"><span class="rr-eyebrow">Text first, newest on top</span><h1>All announcements</h1></div>
  <div class="chips" role="group" aria-label="Floor" id="floors"></div>
  <div class="chips" role="group" aria-label="Urgency"><button type="button" data-urgent aria-pressed="false">Urgent only</button></div>
  <section id="list" class="rr-btn-stack rr-span" aria-live="polite"><div class="rr-skel" aria-hidden="true"><i></i><i></i><i></i></div></section>
  <p class="rr-panel rr-span m0" id="err" role="alert" hidden></p>
</main>
<script src="/app.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const time = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  let items = [], floor = 'all', urgentOnly = false;

  function render() {
    const shown = items.filter((a) => (floor === 'all' || a.floor == null || String(a.floor) === floor) && (!urgentOnly || a.urgency === 'urgent'));
    $('list').innerHTML = shown.length
      ? shown.map((a) => `<div class="rr-announce"${a.urgency === 'urgent' ? ' data-urgency="urgent"' : ''}><span class="rr-eyebrow">${a.urgency === 'urgent' ? 'Urgent' : 'Info'} · ${a.floor == null ? 'All floors' : `Floor ${Number(a.floor)}`} · ${time(a.at)}</span><span>${RR.esc(a.text)}</span></div>`).join('')
      : '<p class="note">Nothing for this floor right now.</p>';
  }
  function chips(floors) {
    $('floors').innerHTML = ['all', ...floors].map((f) => `<button type="button" data-floor="${f}" aria-pressed="${f === floor}">${f === 'all' ? 'All floors' : `Floor ${f}`}</button>`).join('');
    $('floors').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
      floor = b.dataset.floor;
      $('floors').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
      render();
    }));
  }
  document.querySelector('[data-urgent]').addEventListener('click', (e) => {
    urgentOnly = !urgentOnly;
    e.target.setAttribute('aria-pressed', urgentOnly);
    render();
  });

  (async () => {
    try {
      const [list, floors] = await Promise.all([RR.api('/announcements'), RR.api('/floors')]);
      items = list;
      chips(floors.map((f) => String(f.floor)).sort());
      render();
    } catch (x) { RR.showError($('err'), x); }
    RR.live('*', { announcement: (a) => { items.unshift(a); render(); } });
  })();
</script>
</body>
</html>
