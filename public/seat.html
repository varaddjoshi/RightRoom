<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My seat · RightRoom</title>
<link rel="stylesheet" href="/rr.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1b2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RightRoom">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body>
<!-- "My seat" before you've joined any room: say so and offer the two ways in. -->
<main class="rr-screen">
  <header class="rr-sign"><span class="rr-eyebrow">My seat</span><h1>You haven't picked a room yet</h1></header>
  <div class="rr-panel"><p class="m0">Find a room with free seats on the schedule, or scan the code on a room's door. Once you queue, claim a seat or check in, it shows here.</p></div>
  <div class="rr-btn-stack">
    <a class="rr-btn" href="/sessions">Find a room</a>
    <a class="rr-btn rr-btn--ghost" href="/scan">Scan a door code</a>
  </div>
</main>
<script src="/app.js"></script>
<script>
  // If you've since joined a room, go straight to it.
  const room = RR.recall('rr-room');
  if (room) location.replace('/r/' + encodeURIComponent(room));
</script>
</body>
</html>
