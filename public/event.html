<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Now · RightRoom</title>
<link rel="stylesheet" href="/rr.css">
<style>
  .seat { display: flex; align-items: center; justify-content: space-between; gap: var(--rr-s3); }
  .seat .rr-btn { width: auto; min-width: 120px; }
  .venue { display: flex; align-items: center; justify-content: space-between; gap: var(--rr-s3); }
  .risk { font-size: var(--rr-t-xs); font-weight: 700; color: var(--rr-full); }
  @media (min-width: 960px) { #home { grid-column: 1; } #upcoming { grid-column: 2; grid-row: 2 / span 4; } }
</style>
</head>
<body>
<!-- "Now": the attendee home. It adapts to where you are in the day: register, your seat, then what's on now and next. -->
<main class="rr-screen rr-screen--wide" id="main">
  <div class="rr-sign rr-span"><span class="rr-eyebrow">Venue · Hall A</span><h1 id="title">KubeCon hack day</h1></div>
  <section id="home" class="rr-btn-stack" aria-live="polite"></section>
  <section id="upcoming" class="rr-btn-stack" aria-labelledby="h-up"><h2 class="rr-sr" id="h-up">What's on</h2></section>
  <p class="rr-panel rr-span m0" id="err" role="alert" hidden></p>
</main>
<script src="/app.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const enc = encodeURIComponent;
  const time = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  let me = null;

  // Stand-in schedule for the next two slots. shortcut: the mock API has no session times or "next" talks;
  // replace with real start times from the schedule data (P1) when /api/sessions carries them.
  const NEXT = { 204: 'eBPF for observability', 210: 'OpenTelemetry in production', 220: 'Platform teams that scale', 118: 'Rust operators', 101: 'Keynote: the cloud native decade', 305: 'SBOMs that people read', 310: 'Helm charts, done right' };
  const LATER = { 204: 'Kernel tracing lab', 210: 'SLOs without tears', 220: 'Lightning talks II', 118: 'WASM at the edge', 101: 'Closing panel', 305: 'Sigstore hands-on', 310: 'GitOps with Argo CD' };
  const slot = (mins) => { const d = new Date(); d.setMinutes(Math.floor(d.getMinutes() / 30) * 30 + mins, 0, 0); return d; };

  function registration(entry, venue) {
    if (!me) return `<div class="rr-panel venue"><div><b>${venue.taken} of ${venue.capacity}</b> registered</div>${RR.status(venue.status)}</div><a class="rr-btn" href="/login?next=/event">Sign in to register</a>`;
    if (me.role === 'guest') return `<div class="rr-panel"><p class="m0">You're browsing as a guest. Room doors work; registering for the venue needs an account.</p></div><a class="rr-btn rr-btn--ghost" href="/login?next=/event">Create an account</a>`;
    if (!entry) return `<div class="rr-panel venue"><div><b>${venue.taken} of ${venue.capacity}</b> registered · ${RR.esc(venue.rule)}</div>${RR.status(venue.status)}</div><button class="rr-btn" type="button" id="reg">Register for the day</button>`;
    if (entry.status === 'waiting') return `<div class="rr-panel rr-position"><span class="rr-eyebrow">Your place on the waitlist</span><strong>#${Number(entry.position)}</strong><p>${RR.esc(entry.reason)} This page updates when you're admitted.</p></div>${notifyBtn()}`;
    if (entry.status === 'admitted' && entry.scannedIn) return '';
    if (entry.status === 'admitted') return `<div class="rr-panel">${RR.status('free', "You're in")}<p class="m0">Scan in at the venue door by <b>${time(entry.expiresAt)}</b> to keep your place.</p></div><a class="rr-btn rr-btn--ghost" href="/r/venue">I'm at the venue door</a>`;
    if (entry.status === 'expired') return `<div class="rr-panel">${RR.status('full', 'Admission expired')}<p class="m0">Nobody scanned in for this place in time, so it went to the waitlist.</p></div><button class="rr-btn" type="button" id="reg">Join the waitlist again</button>`;
    return '';
  }
  const notifyBtn = () => ('Notification' in window && Notification.permission === 'default') ? `<button class="rr-btn rr-btn--ghost rr-btn--plain" type="button" id="notify">Tell me when I'm in</button>` : '';

  // "My seat": whatever you're doing in a room right now, one tap away.
  async function mySeat() {
    const room = RR.recall('rr-room');
    if (!me || !room) return '';
    const r = await RR.api(`/spaces/${enc(room)}`).catch(() => null);
    const m = r?.me || {};
    const what = m.checkedIn ? `You're in · ${RR.zoneName(m.checkedIn.zone)}` : m.claimed ? `Seat claimed · code ${m.claimed.code}` : m.queue?.status === 'offered' ? 'A seat is waiting for you' : m.queue?.status === 'waiting' ? `In the queue · #${m.queue.position}` : '';
    if (!what) return '';
    const urgent = m.queue?.status === 'offered' || m.claimed;
    return `<div class="rr-panel seat"><div><span class="rr-eyebrow">Room ${RR.esc(r.id)} · ${RR.esc(r.title)}</span><div><b>${RR.esc(what)}</b></div></div><a class="rr-btn${urgent ? '' : ' rr-btn--ghost'}" href="/r/${enc(r.id)}">${urgent ? 'Open' : 'View'}</a></div>`;
  }

  function upcoming(rooms, risk) {
    const mine = new Set([...(me?.interests || [])]);
    const forYou = (r) => (r.tags || []).some((t) => mine.has(t));
    const row = (r, title, live) => `<a class="talk" href="/r/${enc(r.id)}"><div><b>${RR.esc(title)}</b>
        <span>Room ${RR.esc(r.id)} · Floor ${Number(r.floor)}${live ? ` · ${r.free} seats free` : ''}${forYou(r) ? ' · <span class="star">For you</span>' : ''}</span>
        ${live && risk[r.id] === 'high' && r.status !== 'full' ? '<span class="risk">Likely to fill soon</span>' : ''}</div>${live ? RR.status(r.status) : ''}</a>`;
    const order = (list) => [...list].sort((a, b) => forYou(b) - forYou(a) || (b.free > 0) - (a.free > 0) || a.floor - b.floor);
    const now = slot(0), next = slot(60), later = slot(120);
    return `<div class="slot"><h2>Happening now <small>${time(now)} ${RR.label('live')}</small></h2>${order(rooms).map((r) => row(r, r.title, true)).join('')}</div>
      <div class="slot"><h2>Up next <small>${time(next)} ${RR.label('stand-in')}</small></h2>${order(rooms).filter((r) => NEXT[r.id]).map((r) => row(r, NEXT[r.id], false)).join('')}</div>
      <details class="rr-more"><summary>Later today · ${time(later)}</summary><div>${order(rooms).filter((r) => LATER[r.id]).map((r) => row(r, LATER[r.id], false)).join('')}<p class="note">Times for later sessions are stand-ins until the real schedule is loaded.</p></div></details>`;
  }

  async function render() {
    try {
      const [{ venue, me: entry }, rooms, fc, seat] = await Promise.all([RR.api('/event'), RR.api('/sessions'), RR.api('/forecast').catch(() => ({ sessions: [] })), mySeat()]);
      const risk = Object.fromEntries((fc.sessions || []).map((s) => [s.room, s.risk]));
      $('title').textContent = entry?.status === 'admitted' ? "Here's what's on" : entry?.status === 'waiting' ? "You're on the waitlist" : 'KubeCon hack day';
      $('home').innerHTML = seat + registration(entry, venue);
      $('upcoming').innerHTML = `<h2 class="rr-sr" id="h-up">What's on</h2>${upcoming(rooms, risk)}`;
      $('reg')?.addEventListener('click', register);
      $('notify')?.addEventListener('click', async () => { await Notification.requestPermission(); render(); });
      return entry;
    } catch (x) { RR.showError($('err'), x); }
  }
  async function register() {
    $('err').hidden = true;
    try { await RR.api('/event/register', { method: 'POST' }); render(); } catch (x) { RR.showError($('err'), x); }
  }

  (async () => {
    me = await RR.whoami();
    RR.here('Hall A');
    let last = (await render())?.status;
    let t;
    const soon = () => { clearTimeout(t); t = setTimeout(render, 300); };
    RR.live('*', {
      status: soon,
      position: async () => {
        const entry = await render();
        if (last === 'waiting' && entry?.status === 'admitted' && 'Notification' in window && Notification.permission === 'granted') new Notification("You're in at RightRoom", { body: `Scan in at the venue door by ${time(entry.expiresAt)}.` });
        last = entry?.status;
      },
    });
  })();
</script>
</body>
</html>
