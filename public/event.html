<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Now · RightRoom</title>
<link rel="stylesheet" href="/rr.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1b2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RightRoom">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  .seat { display: flex; align-items: center; justify-content: space-between; gap: var(--rr-s3); }
  .seat .rr-btn { width: auto; min-width: 120px; }
  .venue { display: flex; align-items: center; justify-content: space-between; gap: var(--rr-s3); }
  .risk { font-size: var(--rr-t-xs); font-weight: 700; color: var(--rr-full); }
  .go { font-size: var(--rr-t-sm); font-weight: 700; color: var(--rr-free); }
  #details { justify-self: start; min-height: 44px; display: inline-flex; align-items: center; font-weight: 700; }
  @media (min-width: 960px) { #home { grid-column: 1; } #upcoming { grid-column: 2; grid-row: 2 / span 4; } }
</style>
</head>
<body>
<!-- "Now": the attendee home. It adapts to where you are in the day: register, your seat, then what's on now and next. -->
<main class="rr-screen rr-screen--wide" id="main">
  <div class="rr-sign rr-span"><span class="rr-eyebrow" id="where">Venue · Hall A</span><h1 id="title">Now</h1><a id="details" href="/events" class="note">Event details and full agenda</a></div>
  <section id="home" class="rr-btn-stack" aria-live="polite"><div class="rr-skel" aria-hidden="true"><i></i><i></i><i></i></div></section>
  <section id="upcoming" class="rr-btn-stack" aria-label="What's on"><div class="rr-skel" aria-hidden="true"><i></i><i></i><i></i></div></section>
  <p class="rr-panel rr-span m0" id="err" role="alert" hidden></p>
</main>
<script src="/app.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const enc = encodeURIComponent;
  // Times are shown in the event's timezone and "now" is the server's (demo) clock, from GET /api/events/:slug.
  let tz, nowMs = Date.now();
  const time = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', timeZone: tz });
  let me = null, ev = null, overlapOk = false;

  const slot = (mins) => { const d = new Date(nowMs); d.setMinutes(Math.floor(d.getMinutes() / 30) * 30 + mins, 0, 0); return d; };

  function registration(entry, venue) {
    if (!me) return `<div class="rr-panel venue"><div><b>${venue.taken} of ${venue.capacity}</b> registered</div>${RR.status(venue.status)}</div><a class="rr-btn" href="/login?next=/event">Sign in to register</a>`;
    if (me.role === 'guest') return `<div class="rr-panel"><p class="m0">You're browsing as a guest. Room doors work; registering for the venue needs an account.</p></div><a class="rr-btn rr-btn--ghost" href="/login?next=/event">Create an account</a>`;
    if (!entry) return `<div class="rr-panel venue"><div><b>${venue.taken} of ${venue.capacity}</b> registered · ${RR.esc(venue.rule)}</div>${RR.status(venue.status)}</div><button class="rr-btn" type="button" id="reg">Register for the day</button>`;
    if (entry.status === 'waiting') return `<div class="rr-panel rr-position"><span class="rr-eyebrow">Your place on the waitlist</span><strong>#${Number(entry.position)}</strong><p>${RR.esc(entry.reason)} This page updates when you're admitted.</p></div>${notifyBtn()}`;
    if (entry.status === 'admitted' && entry.scannedIn) return '';
    if (entry.status === 'admitted') return `<div class="rr-panel">${RR.status('free', "You're in")}<p class="m0">Scan in at the venue door by <b>${time(entry.expiresAt)}</b> to keep your place.</p></div><a class="rr-btn rr-btn--ghost" href="/r/venue">I'm at the venue door</a>`;
    if (entry.status === 'expired') return `<div class="rr-panel">${RR.status('full', 'Admission expired')}<p class="m0">Nobody scanned in for this place in time, so it went to the waitlist.</p></div><button class="rr-btn" type="button" id="reg">Join the waitlist again</button>`;
    return '';
  }
  const notifyBtn = () => ('Notification' in window && Notification.permission === 'default') ? `<button class="rr-btn rr-btn--ghost rr-btn--plain" type="button" id="notify">Tell me when I'm in</button>` : '';

  // "My seat": whatever you're doing in a room right now, one tap away.
  async function mySeat() {
    const room = RR.recall('rr-room');
    if (!me || !room) return '';
    const r = await RR.api(`/spaces/${enc(room)}`).catch(() => null);
    const m = r?.me || {};
    const what = m.checkedIn ? `You're in · ${RR.zoneName(m.checkedIn.zone)}` : m.claimed ? `Seat claimed · code ${m.claimed.code}` : m.queue?.status === 'offered' ? 'A seat is waiting for you' : m.queue?.status === 'waiting' ? `In the queue · #${m.queue.position}` : '';
    if (!what) return '';
    const urgent = m.queue?.status === 'offered' || m.claimed;
    return `<div class="rr-panel seat"><div><span class="rr-eyebrow">${RR.esc(RR.roomName(r))} · ${RR.esc(r.title)}</span><div><b>${RR.esc(what)}</b></div></div><a class="rr-btn${urgent ? '' : ' rr-btn--ghost'}" href="/r/${enc(r.id)}">${urgent ? 'Open' : 'View'}</a></div>`;
  }

  // Now / Up next / Later today. "Now" is live; later slots use each room's `next` session (title, startsAt) when
  // the schedule data has it. shortcut: the in-memory demo has no session times, so those slots stay empty there.
  function upcoming(rooms, risk) {
    const mine = new Set([...(me?.interests || [])]);
    // Two shared interests, so a broad tag like "kubernetes" doesn't mark every room.
    const forYou = (r) => (r.tags || []).filter((t) => mine.has(t)).length >= Math.min(2, mine.size);
    const name = (r) => RR.esc(RR.roomName(r));
    const row = (r, s, live) => `<a class="talk" href="/r/${enc(r.id)}"><div><b>${RR.esc(s.title)}</b>
        <span>${name(r)} · Floor ${RR.esc(r.floor)}${s.startsAt ? ` · ${time(s.startsAt)}` : ''}${live ? ` · ${Number(r.free)} seats free` : ''}${forYou(r) ? ' · <span class="star">For you</span>' : ''}</span>
        ${live && risk[r.id] === 'high' && r.status !== 'full' ? '<span class="risk">Likely to fill soon</span>' : ''}
        ${live && r.status === 'full' && RR.nearbyFree(rooms, r) ? `<span class="go">Full · go to ${name(RR.nearbyFree(rooms, r))}, ${Number(RR.nearbyFree(rooms, r).free)} seats free</span>` : ''}</div>${live ? RR.status(r.status) : ''}</a>`;
    const order = (list) => [...list].sort((a, b) => forYou(b) - forYou(a) || (b.free > 0) - (a.free > 0) || a.floor - b.floor);
    // Up next comes from this event's agenda only: sessions starting later today, in rooms the live engine knows.
    const day = (t) => new Date(t).toLocaleDateString('en-CA', { timeZone: tz });
    const nexts = (ev?.sessions || []).filter((s) => Date.parse(s.start) > nowMs && day(s.start) === day(nowMs))
      .flatMap((s) => { const r = rooms.find((x) => x.id === s.room); return r ? [[r, { title: s.title, startsAt: s.start }]] : []; });
    const soon = nexts.filter(([, s]) => new Date(s.startsAt) <= slot(90));
    const later = nexts.filter((x) => !soon.includes(x));
    return `<div class="slot"><h2>Happening now <small>${time(slot(0))} ${RR.label('live')}</small></h2>${order(rooms).map((r) => row(r, r, true)).join('') || '<p class="note">Nothing is running right now.</p>'}</div>
      <div class="slot"><h2>Up next</h2>${soon.map(([r, s]) => row(r, s, false)).join('') || '<p class="note">The next sessions show here once the day\'s schedule is loaded.</p>'}</div>
      ${later.length ? `<details class="rr-more"><summary>Later today · ${later.length}</summary><div>${later.map(([r, s]) => row(r, s, false)).join('')}</div></details>` : ''}`;
  }

  async function render() {
    try {
      const [{ venue, me: entry, slug, name }, rooms, fc, seat] = await Promise.all([RR.api('/event'), RR.api('/sessions'), RR.api('/forecast').catch(() => ({ sessions: [] })), mySeat()]);
      if (slug && !ev) { ev = await RR.api(`/events/${enc(slug)}`).catch(() => null); tz = ev?.timezone; $('details').href = `/e/${enc(slug)}`; }
      if (ev) nowMs = Date.parse(ev.now);
      $('where').textContent = `${name || 'Venue'} · ${ev ? `${ev.city} · ` : ''}Hall A`;
      const risk = Object.fromEntries((fc.sessions || []).map((s) => [s.room, s.risk]));
      $('title').textContent = entry?.status === 'admitted' ? "Here's what's on" : entry?.status === 'waiting' ? "You're on the waitlist" : (name || 'Now');
      $('home').innerHTML = seat + registration(entry, venue);
      $('upcoming').innerHTML = upcoming(rooms, risk);
      $('reg')?.addEventListener('click', register);
      $('notify')?.addEventListener('click', async () => { await Notification.requestPermission(); render(); });
      return entry;
    } catch (x) { RR.showError($('err'), x); }
  }
  // Registers through the event's RSVP endpoint, which warns when the dates overlap another event you joined.
  async function register() {
    $('err').hidden = true;
    try {
      await RR.api(ev ? `/events/${enc(ev.slug)}/rsvp` : '/event/register', { method: 'POST', body: { force: overlapOk } });
      RR.toast('Registered'); render();
    } catch (x) {
      if (!x.data?.overlap) return RR.showError($('err'), x);
      overlapOk = true;
      $('err').textContent = `${x.message} Press Register again to join both.`;
      $('err').hidden = false;
    }
  }

  (async () => {
    me = await RR.whoami();
    // Home by role: organisers land on the board, door staff on their door (or a door picker).
    if (me?.role === 'organiser') return location.replace('/staff/setup');
    if (me?.role === 'staff') { const d = RR.recall('rr-door'); return location.replace(d ? `/staff/room/${encodeURIComponent(d)}` : '/sessions?pick=door'); }
    RR.here('Hall A');
    let last = (await render())?.status;
    let t;
    const soon = () => { clearTimeout(t); t = setTimeout(render, 300); };
    RR.live('*', {
      status: soon,
      position: async () => {
        const entry = await render();
        if (last === 'waiting' && entry?.status === 'admitted' && 'Notification' in window && Notification.permission === 'granted') new Notification("You're in at RightRoom", { body: `Scan in at the venue door by ${time(entry.expiresAt)}.` });
        last = entry?.status;
      },
    });
  })();
</script>
</body>
</html>
