# Create this once, and Argo CD deploys deploy/ from branch `deployed`, which the
# build-and-deploy Action rewrites on every merge to main.
# Ask your agent to apply it through Radar's MCP server (apply_resource), or
# apply it from Radar Cloud. Your repo must be public so Argo CD can read it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app
  namespace: team-pantheon
spec:
  project: team-pantheon
  source:
    repoURL: https://github.com/varaddjoshi/RightRoom.git
    targetRevision: deployed
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: team-pantheon
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
