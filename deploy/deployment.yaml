apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  # Exactly one replica: the live stream (/api/stream) keeps its open connections
  # in memory, so a second pod would miss events (docs/architecture.md). Leave it
  # at 1 and don't turn on the HPA (examples/hpa) until that changes.
  replicas: 1
  # One pod means a rolling update must start the new pod before stopping the old.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          # Keys (ELASTICSEARCH_URL, ELASTICSEARCH_API_KEY, DASH0_OTLP_ENDPOINT,
          # DASH0_TOKEN, optional ES_INDEX_PREFIX) come from Secret app-credentials, which is created by
          # hand in the cluster and never committed (docs/deploy.md). optional: the
          # pod still starts before the Secret exists.
          envFrom:
            - secretRef:
                name: app-credentials
                optional: true
            # Browser monitoring token (DASH0_BROWSER_TOKEN, src/rum.js). Its own Secret, so adding or changing it
            # never touches app-credentials: re-applying a partial app-credentials in Radar could delete its other
            # keys. Created by hand, never committed (docs/deploy.md). optional: monitoring is simply off without it.
            - secretRef:
                name: browser-credentials
                optional: true
          # Listed here so they win over the same names in the Secret.
          env:
            - name: PORT
              value: "8080"
            - name: TEAM_NAME
              value: "pantheon"
            # The demo's saved state (src/store.js). Only the cluster uses this index; laptops get their own.
            - name: STATE_INDEX
              value: "rr_engine_state"
            # Demo clock (src/clock.js): the app's "now" starts at Tuesday 11:45 at KubeCon (when most real talks run)
            # and ticks forward from there. It restarts at 11:45 on every restart or deploy. Not a secret. Delete these
            # two lines after judging to go back to real time. A value that is not a valid time stops the app starting.
            - name: DEMO_CLOCK
              value: "2026-11-10T11:45:00-07:00"
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
