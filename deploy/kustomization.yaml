# Argo CD deploys this folder from branch `deployed`, not from main. On every
# merge to main, the build-and-deploy Action builds the image and writes main plus
# the new tag (newTag below) to `deployed`. On main the tag stays `latest`; don't
# edit newName or newTag by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: team-pantheon
resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml
images:
  - name: app
    newName: ghcr.io/varaddjoshi/rightroom
    newTag: a7dd8c6
